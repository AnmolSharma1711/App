name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Expo Prebuild (Android)
        run: npx expo prebuild --platform android --clean

      - name: Configure Gradle Properties
        run: |
          cat >> android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4g -Xms512m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.configureondemand=false
          org.gradle.workers.max=2
          newArchEnabled=false
          hermesEnabled=true
          EOF

      - name: Grant gradlew execute permission
        run: chmod +x android/gradlew

      - name: Test Metro bundle first (catch JS errors early)
        run: |
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file node_modules/expo-router/entry.js \
            --bundle-output /tmp/index.android.bundle \
            --assets-dest /tmp/assets 2>&1

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx4g"
          _JAVA_OPTIONS: "-Xmx4g -Xms512m"
        run: cd android && ./gradlew assembleDebug --no-daemon --max-workers=2 --stacktrace 2>&1 | grep -E "(FAILURE|ERROR|error:|warning:|what went wrong|node.*exit|Cannot|Module not found)" | head -50

      - name: Find APK files (diagnostic)
        if: always()
        run: find android -name "*.apk" -type f 2>/dev/null || echo "No APK files found"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JanSahayak-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
