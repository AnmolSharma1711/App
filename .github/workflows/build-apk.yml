name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Validate JS bundle with Expo export
        run: npx expo export --platform android --output-dir /tmp/expo-bundle

      - name: Expo Prebuild (Android)
        run: npx expo prebuild --platform android --clean

      - name: Configure Gradle Properties
        run: |
          cat >> android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4g -Xms512m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.configureondemand=false
          org.gradle.workers.max=2
          newArchEnabled=false
          hermesEnabled=true
          EOF

      - name: Grant gradlew execute permission
        run: chmod +x android/gradlew

      - name: Build Debug APK (capture full log)
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx4g"
          _JAVA_OPTIONS: "-Xmx4g -Xms512m"
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --max-workers=2 --stacktrace --warning-mode all 2>&1 | tee /tmp/gradle.log
          exit ${PIPESTATUS[0]}

      - name: Show key errors from build log
        if: failure()
        run: |
          echo "====== WHAT WENT WRONG ======"
          grep -A 30 "What went wrong" /tmp/gradle.log | head -60
          echo ""
          echo "====== CAUSED BY ======"
          grep -A 5 "Caused by" /tmp/gradle.log | head -40

      - name: Upload full Gradle log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log.txt
          path: /tmp/gradle.log

      - name: Find APK files
        if: always()
        run: find android -name "*.apk" -type f 2>/dev/null || echo "No APK files found"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JanSahayak-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
